# 开发容器：复用仓库根目录 docker-compose.infra.yaml（Redis 集群 + Mongo）。
# 由 .devcontainer/devcontainer.json 合并加载：
#   dockerComposeFile: ["../docker-compose.infra.yaml", "docker-compose.extend.yml"]

services:
  dsservices:
    build:
      context: .
      dockerfile: Dockerfile
    volumes:
      - ..:/workspace
      - /var/run/docker.sock:/var/run/docker.sock
    command: /bin/sh -c "while sleep 1000; do :; done"
    networks:
      - ds-infra
    # 等 Mongo 健康、Redis 集群初始化完成后再进开发容器
    depends_on:
      mongodb-server:
        condition: service_healthy
      redis-cluster-init:
        condition: service_completed_successfully

  # 覆盖 infra：开发环境随 compose up 自动做集群初始化（去掉 profile）
  redis-cluster-init:
    profiles: []
    restart: "no"

networks:
  ds-infra:
    name: ds-infra
